name: Update data and deploy

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC den 1:a every month status
    - cron: "0 4 * * 1" # 04:00 UTC monday from Baserow
  workflow_dispatch:
    inputs:
      check_status:
        description: "Check online status"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUN_STATUS_CHECK: ${{ github.event.schedule == '0 3 1 * *' || inputs.check_status == true }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch data from Baserow
        env:
          BASEROW_TOKEN: ${{ secrets.BASEROW_TOKEN }}
        run: python scripts/fetch_baserow.py

      - name: Check online status
        if: env.RUN_STATUS_CHECK == 'true'
        run: python scripts/check_status.py

      - name: Commit status results
        if: env.RUN_STATUS_CHECK == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/
          git diff --cached --quiet || git commit -m "Online status check $(date +%Y-%m-%d)"
          git push

      - run: python scripts/export.py

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4